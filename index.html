<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้องเรียน</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  background: #f5f5f5;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #eafff0;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.profile img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
}

input, textarea, button {
  display: block;             
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  box-sizing: border-box;     
  -webkit-appearance: none;   
  border: 1px solid #ccc;     
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
}

input[type="datetime-local"] {
  min-height: 45px;           
  background-color: #ffffff;
}

button {
  background: #06c755;
  color: white;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.2s, opacity 0.2s;
}

/* สไตล์ปุ่มเมื่อโดนปิดการใช้งาน (Disabled) */
button:disabled {
  background: #ccc !important;
  cursor: not-allowed;
  opacity: 0.7;
}

.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); display: none;
  justify-content: center; align-items: center; z-index: 99999;
}
.modal-card {
  background: #fff; padding: 24px 20px; border-radius: 16px;
  text-align: center; width: 85%; max-width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.modal-icon {
  width: 50px; height: 50px; border-radius: 50%; font-size: 26px;
  font-weight: bold; display: flex; align-items: center;
  justify-content: center; margin: 0 auto 12px;
}
/* สไตล์ Success */
.modal-icon.Success { background: #e8f5e9; color: #2e7d32; }
.modal-btn.Success { background: #06c755; }
/* สไตล์ Error */
.modal-icon.Error { background: #ffebee; color: #c62828; }
.modal-btn.Error { background: #d32f2f; }

.modal-message { font-size: 16px; color: #333; margin: 0 0 20px; font-weight: 500; }
.modal-btn {
  width: 100%; padding: 12px; color: #fff; border: none;
  border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>แจ้งร้องเรียน</h2>

  <div class="profile">
    <img id="avatar" src="https://via.placeholder.com/50" alt="profile">
    <div>
      <div>ผู้แจ้ง</div>
      <b id="lineName">กำลังโหลด...</b>
    </div>
  </div>

  <input id="title" placeholder="หัวข้อ">
  <input id="location" placeholder="สถานที่">

  <div style="margin-top: 10px;">เวลาที่พบปัญหา</div>
  <input type="datetime-local" id="timemeet">

  <textarea id="detail" rows="5" placeholder="รายละเอียด"></textarea>

  <!-- ปิดการใช้งานปุ่มเริ่มต้นไว้ก่อน -->
  <button id="submitBtn" onclick="sendComplaint()" disabled>กำลังโหลดข้อมูล...</button>
</div>

<div id="customModal" class="modal-overlay">
  <div class="modal-card">
    <div id="modalIcon" class="modal-icon">✓</div>
    <p id="modalMessage" class="modal-message"></p>
    <button id="modalBtn" class="modal-btn">ตกลง</button>
  </div>
</div>

<script>
const LIFF_ID = "2011006745-pUOxZszu"; // เปลี่ยนเป็น LIFF ID ของคุณ
let profile = null;

async function initLIFF() {
  const submitBtn = document.getElementById("submitBtn");
  
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    profile = await liff.getProfile();
    console.log("Profile:", profile);

    // แสดงชื่อ
    document.getElementById("lineName").innerText = profile.displayName || "ผู้ใช้งาน LINE";

    // แสดงรูปภาพ (ใส่ รูปสำรอง หากผู้ใช้ไม่มีรูปโปรไฟล์)
    const defaultAvatar = "https://via.placeholder.com/50";
    document.getElementById("avatar").src = profile.pictureUrl || defaultAvatar;

    // เปิดใช้งานปุ่มเมื่อโหลด Profile เสร็จเรียบร้อย
    submitBtn.disabled = false;
    submitBtn.innerText = "ส่งเรื่อง";

  } catch (error) {
    console.error("LIFF Initialization failed:", error);
    document.getElementById("lineName").innerText = "โหลดข้อมูลไม่สำเร็จ";
    submitBtn.innerText = "เกิดข้อผิดพลาดในการโหลด";
  }
}

async function sendComplaint() {
  const submitBtn = document.getElementById("submitBtn");

  if (!profile) {
    showModal("Error", "ยังไม่ได้ Login LINE หรือข้อมูลโปรไฟล์ยังโหลดไม่เสร็จ");
    return;
  }

  const title = document.getElementById("title").value.trim();
  const location = document.getElementById("location").value.trim();
  const timemeet = document.getElementById("timemeet").value;
  const detail = document.getElementById("detail").value.trim();

  if (!title || !location || !detail) {
    showModal("Error", "กรุณากรอกข้อมูลให้ครบถ้วน");
    return;
  }

  // ล็อคปุ่มทันทีเมื่อกดส่ง ป้องกันการกดซ้ำ
  submitBtn.disabled = true;
  submitBtn.innerText = "กำลังส่งข้อมูล...";

  // รูปภาพสำหรับ Flex Message (ต้องเป็น https และไม่เป็นค่าว่าง)
  const userPicture = profile.pictureUrl || "https://via.placeholder.com/150";

  try {
    await liff.sendMessages([
      {
        type: "text",
        text: "[ระบบ] ส่งเรื่องร้องเรียน"
      },
      {
        type: "flex",
        altText: "ร้องเรียน",
        contents: {
          type: "bubble",
          header: {
            type: "box",
            layout: "vertical",
            contents: [
              {
                type: "text",
                text: "ร้องเรียน",
                weight: "bold",
                color: "#ffffff"
              }
            ],
            backgroundColor: "#06C755"
          },
          body: {
            type: "box",
            layout: "vertical",
            contents: [
              {
                type: "image",
                url: userPicture,
                size: "md",
                aspectMode: "cover",
                aspectRatio: "1:1",
                align: "center"
              },
              {
                type: "text",
                text: profile.displayName,
                weight: "bold",
                size: "lg",
                align: "center",
                margin: "md"
              },
              {
                type: "separator",
                margin: "lg"
              },
              {
                type: "text",
                text: title,
                weight: "bold",
                size: "lg",
                wrap: true,
                margin: "lg"
              },
              {
                type: "text",
                text: `สถานที่ : ${location}`,
                wrap: true,
                margin: "md"
              },
              {
                type: "text",
                text: `เวลาที่พบ : ${timemeet}`,
                wrap: true,
                margin: "md"
              },
              {
                type: "text",
                text: `รายละเอียด : ${detail}`,
                wrap: true,
                margin: "md"
              }
            ]
          }
        }
      }
    ]);

    showModal("Success", "ส่งเรียบร้อย", function() {
      liff.closeWindow();
    });

  } catch (err) {
    console.error("Error sending message:", err);
    showModal("Error", "เกิดข้อผิดพลาด กรุณาลองใหม่: " + err.message);
    
    // คืนค่าปุ่มให้กดใหม่ได้หากเกิดข้อผิดพลาด
    submitBtn.disabled = false;
    submitBtn.innerText = "ส่งเรื่อง";
  }
}

// ฟังก์ชันสำหรับเปิด Modal
function showModal(type, message, callback) {
  const modal = document.getElementById("customModal");
  const icon = document.getElementById("modalIcon");
  const btn = document.getElementById("modalBtn");

  // ตั้งค่าไอคอนตามประเภท (Success หรือ Error)
  const isError = type.toLowerCase() === "error";
  icon.innerText = isError ? "✕" : "✓";
  icon.className = "modal-icon " + (isError ? "Error" : "Success");
  btn.className = "modal-btn " + (isError ? "Error" : "Success");

  // ใส่ข้อความ
  document.getElementById("modalMessage").innerText = message;

  // กดตกลงแล้วทำอะไรต่อ (Callback)
  btn.onclick = function () {
    modal.style.display = "none";
    if (typeof callback === "function") callback();
  };

  modal.style.display = "flex";
}

// เรียกใช้งาน initLIFF เมื่อ DOM โหลดเสร็จเรียบร้อย
document.addEventListener("DOMContentLoaded", function() {
  initLIFF();
});
</script>

</body>
</html>
