<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>แจ้งร้องเรียน</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:20px;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  background:#eafff0;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}

.profile img{
  width:50px;
  height:50px;
  border-radius:50%;
}

input,textarea,button{
  width:100%;
  margin-top:10px;
  padding:12px;
  box-sizing:border-box;
}

button{
  background:#06c755;
  color:white;
  border:0;
  border-radius:8px;
}
</style>

</head>


<body>


<div class="box">


<h2>
แจ้งร้องเรียน
</h2>


<div class="profile">

<img id="avatar"
src="https://via.placeholder.com/50">


<div>

<div>
ผู้แจ้ง
</div>

<b id="lineName">
กำลังโหลด...
</b>

</div>


</div>



<input 
id="title"
placeholder="หัวข้อ">


<textarea
id="detail"
rows="5"
placeholder="รายละเอียด">
</textarea>



<button onclick="sendComplaint()">
ส่งเรื่อง
</button>


</div>




<script>


const LIFF_ID =
"ใส่_LIFF_ID";


let profile = null;



async function initLIFF(){


await liff.init({

liffId:LIFF_ID

});



if(!liff.isLoggedIn()){

liff.login();

return;

}



profile =
await liff.getProfile();



console.log(profile);



// แสดงชื่อ

document.getElementById(
"lineName"
).innerText =
profile.displayName;



// แสดงรูป

if(profile.pictureUrl){

document.getElementById(
"avatar"
).src =
profile.pictureUrl;

}


}



async function sendComplaint(){


if(!profile){

alert(
"ยังไม่ได้ Login LINE"
);

return;

}



const title =
document.getElementById(
"title"
).value;



const detail =
document.getElementById(
"detail"
).value;




await liff.sendMessages([

{

type:"flex",

altText:
"แจ้งร้องเรียน",


contents:{


type:"bubble",



header:{

type:"box",

layout:"vertical",

contents:[

{

type:"text",

text:"แจ้งร้องเรียน",

weight:"bold",

color:"#ffffff"

}

],

backgroundColor:"#06C755"

},



body:{

type:"box",

layout:"vertical",

contents:[



// รูป LINE

{

type:"image",

url:
profile.pictureUrl,

size:"md",

aspectMode:"cover",

aspectRatio:"1:1",

align:"center"

},



{

type:"text",

text:
profile.displayName,

weight:"bold",

size:"lg",

align:"center",

margin:"md"

},



{

type:"separator",

margin:"lg"

},



{

type:"text",

text:title,

weight:"bold",

size:"lg",

wrap:true,

margin:"lg"

},



{

type:"text",

text:detail,

wrap:true,

margin:"md"

}



]

}


}


}

]);



alert(
"ส่งเรียบร้อย"
);



liff.closeWindow();



}



initLIFF();



</script>


</body>
</html>
