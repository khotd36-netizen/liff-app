<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>แจ้งเรื่องร้องเรียน</title>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</head>


<body class="bg-slate-100 min-h-screen p-4">


  <div class="max-w-md mx-auto bg-white rounded-xl shadow p-5">


    <h1 class="text-xl font-bold text-emerald-600 mb-4">
      แจ้งเรื่องร้องเรียน
    </h1>


    <div class="flex items-center gap-3 mb-4">

      <img id="avatar" src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full">


      <div>

        <div id="name">
          กำลังโหลด...
        </div>

      </div>

    </div>



    <input id="title" class="w-full border rounded p-2 mb-3" placeholder="หัวข้อเรื่อง">


    <textarea id="description" class="w-full border rounded p-2 mb-3" rows="4" placeholder="รายละเอียด">
</textarea>



    <input id="photos" type="file" multiple accept="image/*" class="mb-3">


    <div id="preview" class="grid grid-cols-3 gap-2">
    </div>


    <button onclick="submitComplaint()" id="btn" class="w-full bg-emerald-600 text-white p-3 rounded mt-4">

      ส่งเรื่องร้องเรียน

    </button>


  </div>



  <script>


    const LIFF_ID = "YOUR_LIFF_ID";


    const GAS_URL = "https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec";



    let profile = null;

    let images = [];



    // -----------------------
    // INIT LIFF
    // -----------------------

    async function initLIFF() {


      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login();

        return;

      }


      profile =
        await liff.getProfile();



      document
        .getElementById("name")
        .innerText =
        profile.displayName;


      if (profile.pictureUrl) {

        document
          .getElementById("avatar")
          .src =
          profile.pictureUrl;

      }


    }



    initLIFF();



    // -----------------------
    // IMAGE
    // -----------------------

    document
      .getElementById("photos")
      .onchange =
      async function (e) {


        images = [];

        document
          .getElementById("preview")
          .innerHTML = "";


        const files = Array.from(e.target.files)
            .slice(0, 5);



        for (const file of files) {


          const base64 = await compressImage(
              file
            );


          images.push(base64);



          let img = document.createElement("img");


          img.src = base64;


          img.className = "w-full h-20 object-cover rounded";


          document.getElementById("preview").appendChild(img);
        }
      };

    // -----------------------
    // Compress
    // -----------------------

    function compressImage(file) {


      return new Promise(resolve => {


        const reader = new FileReader();


        reader.onload = e => {

          const img = new Image();


          img.onload = () => {


            let canvas = document.createElement("canvas");


            let width =
              img.width;


            let height =
              img.height;



            if (width > 1000) {

              height =
                height * 1000 / width;

              width = 1000;

            }


            canvas.width = width;

            canvas.height = height;


            canvas
              .getContext("2d")
              .drawImage(
                img,
                0,
                0,
                width,
                height
              );



            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.7
              )
            );



          };


          img.src =
            e.target.result;


        };


        reader.readAsDataURL(file);



      });


    }




    // -----------------------
    // Submit
    // -----------------------

    async function submitComplaint() {


      let payload = {


        userId:
          profile.userId,


        displayName:
          profile.displayName,


        title:
          document
            .getElementById("title")
            .value,


        description:
          document
            .getElementById("description")
            .value,


        photos:
          images


      };



      Swal.fire({

        title: "กำลังส่งข้อมูล",

        allowOutsideClick: false,

        didOpen() {
          Swal.showLoading();
        }

      });



      try {


        let res =
          await fetch(
            GAS_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(payload)

            }
          );



        let result =
          await res.json();



        if (result.success) {


          Swal.fire(
            "สำเร็จ",
            "ส่งเรื่องร้องเรียนแล้ว",
            "success"
          );


          if (liff.isInClient()) {

            liff.closeWindow();

          }


        } else {


          throw result.error;


        }



      }
      catch (err) {


        Swal.fire(
          "Error",
          err.toString(),
          "error"
        );


      }
    }
  </script>


</body>

</html>
